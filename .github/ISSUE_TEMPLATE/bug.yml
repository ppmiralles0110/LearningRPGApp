name: Bug report
description: Report a reproducible LevelUp Architect defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve LevelUp Architect.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including any visible error message?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Sign in…\n2. Open…\n3. Select…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - npm on Windows
        - npm on macOS
        - npm on Linux
        - Docker Compose
        - Codespaces/devcontainer
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Remove secrets, session cookies, and personal learning data.
