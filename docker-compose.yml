services:
  levelup-architect:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-change-before-production}
      DATABASE_PATH: /app/data/levelup-architect.db
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      MENTOR_PROVIDER: ${MENTOR_PROVIDER:-local}
      MENTOR_API_URL: ${MENTOR_API_URL:-}
      MENTOR_API_KEY: ${MENTOR_API_KEY:-}
      MENTOR_MODEL: ${MENTOR_MODEL:-}
    volumes:
      - levelup-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  levelup-data:
